# Template for a new state's work-search rules. Copy to <two-letter code>.toml.
# Guidance only, not legal advice. Keep this line in the new file's header: the agency's rules
# can change at any time, take precedence over anything in the file, and are the claimant's
# responsibility to know and meet, not Perkins's.
#
# Research checklist, from the state agency's own pages only:
#   1. How many approved activities per week, and what counts as one.
#   2. Which days the claim week covers, and the day the weekly claim is filed.
#   3. The fields the agency's own log form asks for, in its order.
#   4. How long to keep the log.
#   5. Every source URL, and the date you checked them (last_checked).
# Leave a value out rather than guess. See states/README.md.

code = "xx"
name = "State name"
agency = "Short agency name"
agency_full = "Full agency name"
last_checked = "YYYY-MM-DD"
sources = []

required = 0
week_start = "sunday"
claim_day = "monday"
check_day = "wednesday"
raise_day = "friday"
# Optional: a weekly claim filed this many days or more after its week ends is late.
# claim_late_days = 21

retention = ""
rules = []
contact_rule = ""

[[kinds]]
name = "Employer contact"
fields = ["Contact date", "Kind", "Job title or reference number", "Employer or business name", "How", "Type", "Employer contact info"]
# Optional, for a kind the agency's sources don't clearly count: every entry of it is graded
# "potentially counts" (shown, never counted toward the minimum), with this reason.
# counts = "maybe"
# maybe_reason = "One sentence citing the source that leaves it unclear."

# Optional, for a state that asks for different employers each week: name the fields that
# hold the employer and the opening.
# distinct_employers = { employer = "Employer or business name", opening = "Job title or reference number" }

# Optional: a one-time task due a number of days after the claim's first day.
# [[once]]
# task = "Register with the state's job service"
# within_days = 10

# Perkins reminder: a weekly "Due this week" issue in YOUR PRIVATE data repository.
#
# Copy to .github/workflows/perkins-reminder.yml in the private repository that holds your
# data folder (perkins.toml at its root). It refuses to run in a public repository, because
# the issue names employers and dates. See reminders/README.md.

name: Perkins reminder

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays at 15:00 UTC; change to suit
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  # The Perkins version to run. For the strongest pin, use a release's full commit SHA
  # (from the repository's releases page) rather than a tag, since a tag can be moved.
  PERKINS_REF: v1.0.0

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "This repository is public. The reminder issue would publish your job search; stopping."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Get Perkins at a pinned version
        run: |
          git clone --quiet https://github.com/ReboundMan/Perkins.git "$RUNNER_TEMP/perkins"
          git -C "$RUNNER_TEMP/perkins" checkout --quiet "$PERKINS_REF"

      - name: List what is due
        run: python "$RUNNER_TEMP/perkins/run.py" --data . due --days 7 > "$RUNNER_TEMP/due.txt"

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Due this week"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/due.txt"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/due.txt" --assignee "$OWNER"
          fi
